[project]
name = "capmkt-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alok Srivastava", email = "coolaries26@gmail.com" }
]

requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.10,<1.11",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "requests>=2.32",
    "streamlit>=1.40",
    "tenacity>=9",
    "typer>=0.12",
]

[project.scripts]
capmkt-data-platform = "capmkt_data_platform:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
